name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Run every test suite (headless)
        run: GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64 tools/run_tests.sh
      - name: Keep the logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .test-logs
